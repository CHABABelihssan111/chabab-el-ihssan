<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#260914">
<title>إدارة التبرعات — شباب الإحسان</title><link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{color-scheme:light;--wine:#65112f;--wine2:#260914;--gold:#d9b56d;--ink:#261720;--muted:#786b72;--line:#eadfe3;--paper:#f7f3f0;--white:#fff;--green:#13835f;--red:#b4233c;--shadow:0 22px 65px #3c102018}*{box-sizing:border-box}html{min-height:100%;background:var(--paper)}body{margin:0;min-height:100vh;background:radial-gradient(900px 420px at 90% -8%,#ead7dd 0,transparent 68%),radial-gradient(700px 360px at 0 30%,#f0e4d4 0,transparent 65%),var(--paper);font-family:Cairo,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer} [hidden]{display:none!important}.topline{height:5px;background:linear-gradient(90deg,#a77a37,var(--gold),#fff0c6,var(--wine))}.gate-wrap{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at center,#fff9 0,transparent 65%)}.gate{width:min(100%,440px);background:#fff!important;color:#281720!important;border:1px solid #eadce1;border-radius:30px;padding:38px 34px;text-align:center;box-shadow:0 30px 90px #280a1d25,0 0 0 6px #fff8;position:relative;overflow:hidden}.gate:before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--wine),var(--gold),var(--wine))}.gem{width:76px;height:76px;border-radius:24px;margin:0 auto 17px;display:grid;place-items:center;font-size:35px;color:#fff;background:linear-gradient(145deg,#8c3151,#300a1b);box-shadow:0 12px 28px #65112f35}.gate h1{font-size:25px;margin:0;color:#65112f!important}.gate p{margin:8px 0 20px;color:#786b72!important}.gate input{display:block;width:100%;height:56px;border:1px solid #e5d8dd;border-radius:15px;background:#fbf8f8!important;color:#25151c!important;text-align:center;letter-spacing:8px;outline:none;margin:0 0 14px}.gate input:focus{border-color:var(--gold);box-shadow:0 0 0 4px #d9b56d30}.btn{border:0;border-radius:13px;padding:11px 17px;font-weight:800;background:#f3e9ed;color:var(--wine);transition:.2s}.btn:hover{transform:translateY(-2px);filter:brightness(.98)}.primary{width:100%;color:white;background:linear-gradient(120deg,#7e1b40,#350b20);box-shadow:0 10px 24px #65112f30}.err{min-height:24px;color:var(--red);font-size:13px;margin-top:12px}.hero{color:#fff;padding:30px max(4vw,20px) 74px;background:radial-gradient(500px 180px at 85% 0,#ffffff18,transparent 70%),linear-gradient(120deg,#1e0711,#5d102e 58%,#8a3150);border-bottom:4px solid var(--gold)}.hero-inner{max-width:1320px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:2px;color:#e9ca8d;font-weight:800}.hero h1{font-size:clamp(25px,4vw,38px);margin:5px 0}.hero p{margin:0;color:#ffffffb8}.hero .btn{background:#ffffff18;color:white;border:1px solid #ffffff40}.wrap{max-width:1320px;margin:-42px auto 55px;padding:0 22px}.panel{background:#fff;border:1px solid #eadfe3;border-radius:23px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.panel h2{margin:0;color:var(--wine);font-size:21px}.toggle-panel{display:flex;align-items:center;gap:18px}.status-pill{padding:7px 13px;border-radius:99px;background:#e6f5ef;color:#08734f;font-size:13px;font-weight:900}.status-pill.off{background:#fce9ec;color:#a31e38}.switch{width:66px;height:36px;border:0;border-radius:99px;background:#c8bdc2;padding:5px;transition:.25s}.switch i{display:block;width:26px;height:26px;border-radius:50%;background:white;box-shadow:0 2px 7px #0003;transition:.25s}.switch.on{background:var(--green)}.switch.on i{transform:translateX(-30px)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:18px}.stat{position:relative;overflow:hidden;padding:23px;border-radius:22px;background:linear-gradient(145deg,#fff,#fbf6f4);border:1px solid #eadfe3;box-shadow:var(--shadow)}.stat:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:#d9b56d18;left:-25px;top:-35px}.stat b{display:block;font-size:clamp(24px,3vw,34px);color:var(--wine);line-height:1.3}.stat span{font-size:13px;color:var(--muted)}.stat em{display:block;font-style:normal;font-size:11px;color:#a17b43;margin-top:7px}.section-head{margin-bottom:12px}.campaign{margin:18px 0 10px;padding:12px 16px;border-radius:14px;background:linear-gradient(100deg,#f8eff2,#fffaf2);color:var(--wine);border-inline-start:4px solid var(--gold);font-size:18px}.donor{display:grid;grid-template-columns:minmax(0,1fr) 145px;gap:18px;padding:18px;margin:12px 0;border:1px solid var(--line);border-radius:19px;background:#fff;transition:.2s}.donor:hover{box-shadow:0 12px 30px #3c102012;transform:translateY(-2px)}.donor h3{margin:0 0 9px;color:#351624;font-size:18px}.meta{display:flex;gap:9px 18px;flex-wrap:wrap;color:var(--muted);font-size:13px}.meta span{background:#faf6f7;border:1px solid #f0e7ea;border-radius:9px;padding:5px 9px}.receipt{width:145px;height:145px;object-fit:cover;border-radius:15px;border:1px solid var(--line);background:#faf7f5;cursor:zoom-in}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.danger{background:#fff0f1;color:#a51f36}.empty{text-align:center;padding:50px 15px;color:var(--muted)}.empty strong{display:block;font-size:20px;color:var(--wine);margin-bottom:6px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lang{display:flex;gap:5px;background:#ffffff18;padding:4px;border-radius:12px}.lang button{background:transparent;color:#fff;border:0;padding:6px 10px;border-radius:8px;font-size:12px}.lang button.active{background:#fff;color:var(--wine);font-weight:900}.preview{position:fixed;inset:0;z-index:10;background:#10060deF;display:grid;place-items:center;padding:20px;cursor:zoom-out}.preview img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:16px;box-shadow:0 20px 70px #0008}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:13px;background:#24101b;color:white;box-shadow:var(--shadow);z-index:20}@media(max-width:700px){.stats{grid-template-columns:1fr}.donor{grid-template-columns:1fr}.receipt{width:100%;height:220px;object-fit:contain}.toggle-panel{width:100%;justify-content:space-between}.panel{padding:17px}.gate{padding:32px 22px}}
</style></head>
<body><div class="topline"></div>
<section id="gate" class="gate-wrap"><div class="gate"><div class="gem">✦</div><h1 data-i="loginTitle">إدارة التبرعات</h1><p data-i="loginSub">أدخل رمز الإدارة للمتابعة بأمان</p><form id="loginForm"><input id="code" type="password" inputmode="numeric" maxlength="12" placeholder="••••••" autocomplete="current-password" aria-label="Admin access code"><button class="btn primary" type="submit" data-i="login">دخول آمن</button></form><div id="err" class="err" role="alert"></div><div class="lang" style="justify-content:center;background:#f5eef1"><button data-lang="ar" class="active" style="color:#65112f">العربية</button><button data-lang="fr" style="color:#65112f">Français</button><button data-lang="en" style="color:#65112f">English</button></div></div></section>
<div id="app" hidden><header class="hero"><div class="hero-inner"><div><div class="eyebrow" data-i="eyebrow">CENTRE DE PILOTAGE • DONATIONS</div><h1 data-i="title">مركز إدارة التبرعات</h1><p data-i="subtitle">متابعة المساهمات والإيصالات وتنظيمها حسب الحملات</p></div><div class="toolbar"><div class="lang"><button data-lang="ar" class="active">العربية</button><button data-lang="fr">Français</button><button data-lang="en">English</button></div><a class="btn" href="/admin/" data-i="back">لوحة التحكم الرئيسية</a></div></div></header>
<main class="wrap"><section class="panel row"><div><h2 data-i="visibility">ظهور استمارة التبرع</h2><div id="stateText" style="color:var(--muted);font-size:13px;margin-top:4px">...</div></div><div class="toggle-panel"><strong id="stateLabel" class="status-pill">...</strong><button class="switch" id="switch" aria-label="Toggle donation form visibility"><i></i></button></div></section><section class="stats" id="stats"></section><section class="panel"><div class="row section-head"><h2 data-i="campaigns">التبرعات حسب الحملة</h2><button class="btn" id="refresh" data-i="refresh">↻ تحديث البيانات</button></div><div id="list"></div></section></main></div>
<div id="preview" class="preview" hidden role="dialog" aria-modal="true" aria-label="Receipt preview"><img id="previewImg" alt="Payment receipt"></div><div id="toast" class="toast" hidden></div><script src="/admin/donations.js"></script></body></html>
