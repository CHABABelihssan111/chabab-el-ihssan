<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>الملاحظات والاستمارات — شباب الإحسان</title>
<style>
:root{--bg:#f4f2ef;--card:#fff;--ink:#1f2937;--mut:#6b7280;--red:#c8102e;--navy:#7a1034}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--ink:#f3f4f6;--mut:#9ca3af}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;padding:16px;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:900px;margin:auto}.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:12px}
h1{font-size:22px;margin:0 0 12px}
input{font:inherit;padding:12px;border-radius:12px;border:1.5px solid #cbd5e1;width:100%;text-align:center;letter-spacing:8px;font-size:22px;background:transparent;color:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;background:var(--navy);color:#fff;font-weight:700}
button:active{transform:scale(.96)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:transparent;color:var(--ink);border:1.5px solid #cbd5e1}.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs b{background:var(--red);color:#fff;border-radius:99px;padding:0 7px;margin-inline-start:6px;font-size:12px}
.it{border-inline-start:5px solid var(--navy);padding-inline-start:12px}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:6px}
.tag{background:var(--bg);border-radius:99px;padding:2px 10px;font-weight:700;color:var(--ink)}
.msg{white-space:pre-wrap;word-break:break-word;line-height:1.8;margin:6px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:6px 0}.kv span{color:var(--mut)}
.kv a{color:var(--navy);direction:ltr;unicode-bidi:plaintext}
.del{background:transparent;color:var(--red);border:1.5px solid var(--red);padding:5px 12px;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:24px}#err{color:var(--red);text-align:center;min-height:22px;margin-top:8px}
a{color:var(--navy)}
</style></head>
<body><div class="wrap">
<div id="gate" class="card" style="max-width:340px;margin:12vh auto"><h1 style="text-align:center">🔒 الملاحظات والاستمارات</h1>
<input id="code" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autofocus>
<button id="go" style="width:100%;margin-top:12px">دخول</button><div id="err"></div>
<p style="text-align:center;font-size:12px;color:var(--mut)">نفس كود صفحة الإحصائيات</p></div>
<div id="app" hidden>
<div class="card"><h1>💬 الملاحظات والاستمارات</h1>
<div class="tabs" id="tabs"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button id="rf">🔄 تحديث</button><button id="csv">⬇️ تصدير CSV</button></div></div>
<div id="list"></div>
<p style="text-align:center"><a href="/admin/">← لوحة التحكم</a></p></div></div>
<script src="/admin/feedback.js"></script></body></html>
